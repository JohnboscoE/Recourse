<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Recourse — verified settlement">
  <title>Recourse — verified settlement</title>
  <!--
    Horizontal lockup for READMEs, slides and the submission page.
    Text is drawn as paths-free system type on purpose: it renders identically
    without shipping a font, and the mark carries the identity anyway.
  -->
  <defs>
    <linearGradient id="rw-grad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <g transform="translate(6 8) scale(0.75)">
    <path
      fill="url(#rw-grad)"
      fill-rule="evenodd"
      d="M32 3 L58 13.4 V32.2 C58 47 47.4 57.6 32 61 C16.6 57.6 6 47 6 32.2 V13.4 Z
         M32 20.5 L44.5 43.5 H19.5 Z"/>
  </g>

  <text x="62" y="34"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="23" font-weight="600" letter-spacing="-0.6"
        fill="currentColor">Recourse</text>

  <text x="63" y="48"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif"
        font-size="10.5" font-weight="500" letter-spacing="0.6"
        fill="currentColor" opacity="0.55">VERIFIED SETTLEMENT</text>
</svg>
