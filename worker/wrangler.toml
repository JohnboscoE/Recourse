name = "recourse-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# viem and the shared package pull in a few Node built-ins (crypto, buffer).
compatibility_flags = ["nodejs_compat"]

# Automatic settlement. Workers have no long-lived process, so the Node
# backend's 30s setInterval becomes a cron trigger. One minute is the finest
# granularity Cloudflare offers; it changes how fast a settlement lands, never
# whether it happens.
[triggers]
crons = ["* * * * *"]

[vars]
ESCROW_ADDRESS = "0xE21A7446a89b3A8C9A455dC5e1c2A61D21E25982"
KH_BASE_URL = "https://app.keeperhub.com"
KH_MCP_PATH = "/mcp"
KH_WALLET_ADDRESS = "0x2dA51eA57157bc9CFB5799f1dBAAda9B7e432edA"
# Autonomous agent. UNSET = off, and off is the default on purpose: this
# spends real USDC with nobody clicking, and the escrow is public so anyone
# can post a job. Set to "honest" to have it complete jobs, or "fail" to have
# it under-deliver and drive the refund path on its own.
#
# It only takes jobs that pay at least what they cost to deliver, never
# delivers more than AUTO_AGENT_MAX_USDC, and takes one job per sweep.
AUTO_AGENT = "honest"
AUTO_AGENT_MAX_USDC = "0.05"

# Browser origins allowed to call this API. Unset reflects any origin, which
# is fine for a public read-mostly demo but should be pinned once the frontend
# has a stable domain. Add the Vercel origin here and redeploy.
# CORS_ORIGINS = "https://recourse.vercel.app,http://localhost:5173"

# NOTE: BASE_RPC_URL is a SECRET, not a var — the URL embeds an API key and
# this file is committed. Set it with:
#   wrangler secret put BASE_RPC_URL
# It is not optional: without it the Worker falls back to the public Base
# endpoint and /jobs returns 500 "over rate limit" almost immediately, because
# unlike the Node backend there is no read cache in front of the RPC.

[[d1_databases]]
binding = "DB"
database_name = "recourse"
database_id = "547585f3-3c7f-481b-b322-9e5c936817e7"

# Secret, never in this file:
#   wrangler secret put KH_API_KEY
