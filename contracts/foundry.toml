[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Base mainnet for fork tests / deploys. RPC + keys via env, never committed.
[rpc_endpoints]
base = "${BASE_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

# Run Foundry from Git Bash or WSL on Windows (see CLAUDE.md).
